<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#059669" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Outer Power Ring (100% Transparent Background - Only Pure Icon) -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#ringGrad)" stroke-width="26" />

  <!-- Inner Power Ring Arc (85% Savings Gauge) -->
  <circle cx="256" cy="256" r="175" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="20" />
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringGrad)" stroke-width="20" 
          stroke-dasharray="820 1100" stroke-linecap="round" transform="rotate(-90 256 256)" />

  <!-- Central Sharp Lightning Bolt in Bright Gold/Amber with dark emerald outline for universal visibility -->
  <path d="M285 100 L180 260 H265 L220 412 L345 236 H260 Z" 
        fill="url(#goldGrad)" 
        filter="url(#shadow)"
        stroke="#064e3b"
        stroke-width="10"
        stroke-linejoin="round" />
</svg>
