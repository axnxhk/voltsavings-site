<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="ringGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#059669" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Circular Outer Disc / Coin -->
  <circle cx="256" cy="256" r="232" fill="url(#bgGrad3)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="url(#ringGrad3)" stroke-width="12" />

  <!-- Inner Power Ring Arc (Symbolizing 85% battery / 85% fuel savings) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e293b" stroke-width="24" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad3)" stroke-width="24" 
          stroke-dasharray="850 1130" stroke-linecap="round" transform="rotate(-90 256 256)" />

  <!-- Central Sharp Lightning Bolt in Bright Gold/Amber & White -->
  <path d="M280 120 L190 260 H265 L225 390 L335 240 H260 Z" 
        fill="url(#goldGrad3)" 
        filter="url(#shadow3)"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linejoin="round" />
</svg>
